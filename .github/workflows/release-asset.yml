name: Upload APK to Release
on:
  push:
    branches:
      - 'arena/00c98496-examcbt'
      - 'main'
permissions:
  contents: write
jobs:
  upload-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload CBTABM2_ModeTes.apk to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 CBTABM2_ModeTes.apk --clobber
